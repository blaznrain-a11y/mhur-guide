<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MHUR Guide — Meta, Costumes & Combos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>MHUR <span>Guide</span></h1>
      <p class="subtitle">Meta · Costumes · Tuning · Combos</p>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="tierlist">Tier List</button>
    <button class="tab" data-tab="characters">Characters</button>
    <button class="tab" data-tab="videos">Combos</button>
  </nav>

  <!-- TIER LIST -->
  <section id="tierlist" class="section active">
    <h2>Meta Tier List</h2>
    <p class="section-desc">Current best characters ranked by meta strength. Click a character to see their full guide.</p>
    <div id="tier-container"></div>
  </section>

  <!-- CHARACTERS -->
  <section id="characters" class="section">
    <h2>Character Guide</h2>
    <p class="section-desc">Best costumes and tuning builds for every character.</p>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search character..." />
    </div>
    <div id="char-grid"></div>
  </section>

  <!-- VIDEOS -->
  <section id="videos" class="section">
    <h2>Combo Videos</h2>
    <p class="section-desc">Watch combo guides for each character.</p>
    <div id="video-grid"></div>
  </section>

  <!-- CHARACTER MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" id="close-modal">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
